<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101713"><title>FreeForm | Account access</title><link rel="stylesheet" href="assets/freeform.css"><style>body{display:grid;place-items:center;padding:20px}.auth{width:min(100%,450px)}.auth .brand{display:block;text-align:center;margin-bottom:22px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:22px 0}.tab{min-height:42px;border:1px solid var(--line);border-radius:9px;background:#ffffff08;color:var(--muted);cursor:pointer}.tab[aria-selected=true]{background:#2a3a2d;color:var(--text)}[hidden]{display:none!important}</style></head>
<body><main class="auth"><a class="brand" href="index.html"><span style="display:inline-grid;place-items:center;width:34px;height:34px;margin-right:8px;border-radius:10px;background:var(--green);color:#102014">F</span>FreeForm</a><section class="panel"><h1 id="title" class="page-title" style="font-size:32px">Welcome back</h1><p id="subtitle" class="muted">Sign in to continue to your account.</p><div class="tabs" role="tablist"><button class="tab" id="signin-tab" role="tab" aria-selected="true" type="button">Sign in</button><button class="tab" id="signup-tab" role="tab" aria-selected="false" type="button">Create account</button></div>
<form id="auth-form" novalidate><div class="form-field" id="username-field"><label for="username">Username</label><input id="username" name="username" autocomplete="username" minlength="3" maxlength="20" pattern="[A-Za-z0-9_]+" placeholder="3–20 letters, numbers or _" required></div><div class="form-field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required></div><div class="form-field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" minlength="9" maxlength="128" placeholder="At least 9 characters" required></div><div class="form-field" id="confirm-field" hidden><label for="confirm-password">Confirm password</label><input id="confirm-password" type="password" autocomplete="new-password" minlength="9" maxlength="128"></div><button class="btn primary" style="width:100%;min-height:46px" id="submit-button" type="submit">Sign in</button><p id="form-message" class="message" role="status" aria-live="polite"></p></form><p class="muted" style="font-size:12px;line-height:1.6">Accounts use Firebase Authentication and profiles use Firebase Realtime Database after you add your Firebase web app config. Do not use a password you use on other sites.</p></section><p class="footer" style="text-align:center"><a href="index.html">← Back to FreeForm</a></p></main>
<script src="assets/freeform.js"></script><script type="module" src="assets/firebase-cloud.js"></script><script type="module">
const form=document.getElementById('auth-form'),signInTab=document.getElementById('signin-tab'),signUpTab=document.getElementById('signup-tab'),title=document.getElementById('title'),subtitle=document.getElementById('subtitle'),usernameInput=document.getElementById('username'),emailInput=document.getElementById('email'),passwordInput=document.getElementById('password'),confirmField=document.getElementById('confirm-field'),confirmInput=document.getElementById('confirm-password'),submitButton=document.getElementById('submit-button'),message=document.getElementById('form-message'),usernameField=document.getElementById('username-field');let mode='signin';
function say(text,error=false){message.textContent=text;message.classList.toggle('error',error)}
function setMode(next){mode=next;const up=mode==='signup';signInTab.setAttribute('aria-selected',String(!up));signUpTab.setAttribute('aria-selected',String(up));title.textContent=up?'Create your account':'Welcome back';subtitle.textContent=up?'Create a cloud account that can sign in on other devices.':'Sign in with your email and password.';submitButton.textContent=up?'Create account':'Sign in';confirmField.hidden=!up;usernameField.hidden=!up;usernameInput.required=up;confirmInput.required=up;passwordInput.autocomplete=up?'new-password':'current-password';say('')}
signInTab.addEventListener('click',()=>setMode('signin'));signUpTab.addEventListener('click',()=>setMode('signup'));
form.addEventListener('submit',async e=>{e.preventDefault();say('');if(!form.reportValidity())return;const username=usernameInput.value.trim(),email=emailInput.value.trim(),password=passwordInput.value;if(mode==='signup'&&!/^[A-Za-z0-9_]{3,20}$/.test(username)){say('Use 3–20 letters, numbers, or underscores for your username.',true);return}if(password.length<6){say('Password must be at least 6 characters.',true);return}if(mode==='signup'&&password!==confirmInput.value){say('The passwords do not match.',true);confirmInput.focus();return}
submitButton.disabled=true;try{if(!window.FreeFormCloud?.ready)throw new Error('Firebase is not configured. Open firebase-config.js and add your Firebase web app config, then reload this page.');if(mode==='signup')await window.FreeFormCloud.createAccount({username,email,password});else await window.FreeFormCloud.signIn(email,password);location.href='profile.html'}catch(err){say(err.message||'Could not connect to Firebase.',true)}finally{submitButton.disabled=false}});
if(FreeForm.getSession())say('Last used username: '+FreeForm.getSession()+'. Sign in to verify your Firebase account.');
</script></body></html>
